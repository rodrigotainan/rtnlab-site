<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1428">
  <meta name="description" content="A RTN Lab está preparando algo novo. Em breve, novidades.">
  <title>RTN Lab | Em construção</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1428;
      --panel: #111f39;
      --text: #f5f7fb;
      --muted: #b7c3d8;
      --blue: #39a8ff;
      --gold: #ffb21c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 20%, rgba(40, 91, 160, .23), transparent 52%),
        linear-gradient(145deg, #0b1428 0%, #101d36 58%, #0b1428 100%);
    }
    main {
      width: min(100%, 760px);
      text-align: center;
      padding: clamp(28px, 6vw, 64px) clamp(20px, 5vw, 54px);
      border: 1px solid rgba(173, 198, 235, .15);
      border-radius: 28px;
      background: rgba(13, 25, 47, .72);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .25);
    }
    .brand {
      margin: 0 0 48px;
      font-size: clamp(2.5rem, 8vw, 4.3rem);
      font-weight: 750;
      letter-spacing: -.065em;
    }
    .brand .mark { color: var(--blue); margin-right: .12em; }
    .brand .lab { color: var(--blue); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 178, 28, .35);
      border-radius: 999px;
      color: #ffd27b;
      background: rgba(255, 178, 28, .08);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(255, 178, 28, .65);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.1rem);
      line-height: 1.08;
      letter-spacing: -.055em;
    }
    h1 span { color: var(--gold); }
    .message {
      max-width: 540px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      line-height: 1.75;
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 38px auto 22px;
      color: #7184a5;
    }
    .divider::before, .divider::after {
      content: "";
      width: min(22vw, 110px);
      height: 1px;
      background: rgba(151, 174, 211, .35);
    }
    .code { color: var(--blue); font-size: 1.45rem; }
    footer { color: #8fa1bd; font-size: .9rem; }
    footer strong { color: var(--text); font-weight: 650; }
    @media (max-width: 480px) {
      main { border-radius: 20px; }
      .brand { margin-bottom: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand"><span class="mark">&lt;/&gt;</span>RTN<span class="lab">Lab</span></p>
    <div class="eyebrow"><span class="dot"></span> Novidades a caminho</div>
    <h1>Página em <span>construção.</span></h1>
    <p class="message">
      Estamos trabalhando em algo novo para você.
      Em breve, nosso site estará no ar. Obrigado pela visita!
    </p>
    <div class="divider"><span class="code">&lt; / &gt;</span></div>
    <footer><strong>RTN Lab</strong> &nbsp;·&nbsp; rtnlab.com</footer>
  </main>
</body>
</html>
